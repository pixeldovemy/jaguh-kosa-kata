```html
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Teka Kata Kerja AI - Premium</title>
    <!-- Guna font yang lebih moden -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Fredoka', sans-serif; }

        body { 
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            margin: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 25px; 
            border-radius: 40px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.15); 
            max-width: 450px; 
            width: 100%; 
            text-align: center;
            border: 8px solid #ffffff;
        }
        
        .header-info { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 25px;
        }
        
        #level-text, .score-box { 
            padding: 8px 20px; 
            border-radius: 20px; 
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        #level-text { background: #6c5ce7; color: white; }
        .score-box { background: #ffd32a; color: #3d3d3d; }
        
        h2 { 
            color: #ff4757; 
            font-size: 28px; 
            margin-top: 0;
            letter-spacing: -1px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 30px;
            overflow: hidden;
            border: 6px solid #f1f2f6;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        video { 
            width: 100%; 
            display: block;
            background: #000; 
        }
        
        input { 
            padding: 18px; 
            width: 100%; 
            border: 3px solid #f1f2f6; 
            border-radius: 20px; 
            margin-bottom: 20px; 
            font-size: 18px; 
            outline: none; 
            text-align: center;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        input:focus { 
            border-color: #6c5ce7; 
            background: #fff;
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.1);
        }
        
        button { 
            padding: 18px; 
            background: linear-gradient(to right, #6c5ce7, #a29bfe);
            color: white; 
            border: none; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 20px; 
            font-weight: 600; 
            width: 100%; 
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.3);
        }

        button:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 12px 25px rgba(108, 92, 231, 0.4);
            filter: brightness(1.1);
        }

        #result { 
            margin-top: 20px; 
            font-size: 20px; 
            font-weight: 600; 
            min-height: 30px;
            transition: 0.3s;
        }

        /* Animasi Salah - Bergetar */
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body>

<div class="container" id="game-box">
    <div class="header-info">
        <div id="level-text">LEVEL 1</div>
        <div class="score-box">MARKAH: <span id="score">0</span></div>
    </div>

    <h2>Teka Aksi Ini! 🎬</h2>
    
    <div class="video-wrapper">
        <video id="game-video" autoplay loop muted playsinline>
            <source id="video-source" src="videos/menebar.mp4" type="video/mp4">
        </video>
    </div>

    <input type="text" id="user-input" placeholder="Tulis aksi di sini..." autocomplete="off">
    <button onclick="checkAnswer()">SEMAK JAWAPAN</button>
    <p id="result"></p>
</div>

<script>
    const gameData = [
        { word: "menebar", vid: "videos/menebar.mp4" },
        { word: "memasak", vid: "videos/memasak.mp4" },
        { word: "melompat", vid: "videos/melompat.mp4" }
    ];

    let currentLevel = 0;
    let score = 0;

    document.getElementById('user-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') { checkAnswer(); }
    });

    function checkAnswer() {
        const inputField = document.getElementById('user-input');
        const resultText = document.getElementById('result');
        const videoElement = document.getElementById('game-video');
        const videoSource = document.getElementById('video-source');
        const gameBox = document.getElementById('game-box');
        
        let answer = inputField.value.toLowerCase().trim();

        if (answer === gameData[currentLevel].word) {
            score += 10;
            document.getElementById('score').innerText = score;
            resultText.innerText = "WAH, BIJAKNYA! 🎉";
            resultText.style.color = "#2ed573";
            
            setTimeout(() => {
                currentLevel++;
                if (currentLevel < gameData.length) {
                    document.getElementById('level-text').innerText = `LEVEL ${currentLevel + 1}`;
                    videoSource.src = gameData[currentLevel].vid;
                    videoElement.load();
                    videoElement.play();
                    inputField.value = "";
                    resultText.innerText = "";
                } else {
                    document.querySelector('.container').innerHTML = `
                        <h1 style="font-size: 80px; margin: 0;">🏆</h1>
                        <h2 style="color:#6c5ce7; font-size: 32px;">KAU JUARA!</h2>
                        <p style="font-size:22px; color: #555;">Markah Akhir: <b>${score}</b></p>
                        <button onclick="location.reload()">MAIN LAGI</button>
                    `;
                }
            }, 1500);

        } else {
            resultText.innerText = "ALAMAK, SALAH... 🙊";
            resultText.style.color = "#ff4757";
            gameBox.classList.add('shake');
            setTimeout(() => { gameBox.classList.remove('shake'); }, 500);
        }
    }
</script>

</body>
</html>
