<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Word Master - 20 Levels</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <!-- Script Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
        }
        .container { 
            background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 30px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); max-width: 500px; width: 100%; text-align: center;
        }
        .header-info { display: flex; justify-content: space-between; margin-bottom: 20px; }
        #level-text { background: #6c5ce7; color: white; padding: 5px 15px; border-radius: 15px; font-size: 14px; }
        .score-box { background: #ffd32a; padding: 5px 15px; border-radius: 15px; font-size: 14px; font-weight: bold; }
        
        .video-wrapper { width: 100%; border-radius: 20px; overflow: hidden; border: 5px solid #f1f2f6; margin-bottom: 20px; background: #000; }
        video { width: 100%; display: block; }
        
        input { padding: 15px; width: 100%; border: 2px solid #ddd; border-radius: 15px; margin-bottom: 15px; font-size: 16px; text-align: center; outline: none; }
        input:focus { border-color: #6c5ce7; }

        button { 
            padding: 15px; background: #6c5ce7; color: white; border: none; border-radius: 15px; 
            cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; transition: 0.3s;
        }
        button:hover { background: #5649c0; transform: scale(1.02); }

        /* Hint Box Style */
        .hint-section { margin-top: 20px; text-align: left; background: #f8f9fa; padding: 15px; border-radius: 15px; border: 1px dashed #ccc; }
        .hint-title { font-size: 12px; font-weight: bold; color: #888; text-transform: uppercase; margin-bottom: 8px; }
        .hint-list { 
            display: flex; flex-wrap: wrap; gap: 8px; max-height: 80px; overflow-y: auto; 
            padding: 5px; scrollbar-width: thin;
        }
        .hint-item { background: #e2e2e2; padding: 4px 10px; border-radius: 10px; font-size: 12px; color: #555; }

        #result { margin-top: 15px; font-size: 18px; font-weight: bold; min-height: 25px; }
    </style>
</head>
<body>

<div class="container" id="game-box">
    <div class="header-info">
        <div id="level-text">LEVEL 1/20</div>
        <div class="score-box">MARKAH: <span id="score">0</span></div>
    </div>

    <div class="video-wrapper">
        <video id="game-video" autoplay loop muted playsinline>
            <source id="video-source" src="videos/clip1.mp4" type="video/mp4">
        </video>
    </div>

    <input type="text" id="user-input" placeholder="Teka jawapan di sini..." autocomplete="off">
    <button onclick="checkAnswer()">HANTAR JAWAPAN 🚀</button>
    <p id="result"></p>

    <!-- Hint Section -->
    <div class="hint-section">
        <div class="hint-title">Pilihan Jawapan (Klu):</div>
        <div class="hint-list" id="clue-list">
            <!-- List jawapan akan auto-generate kat sini -->
        </div>
    </div>
</div>

<script>
    // Audio Correct (Guna link CDN untuk testing, kau boleh ganti dengan file sendiri)
    const correctSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');

    // Generate 20 levels secara automatik
    const gameData = [];
    for (let i = 1; i <= 20; i++) {
        gameData.push({
            word: `jawapan${i}`, 
            vid: `videos/clip${i}.mp4`
        });
    }

    let currentLevel = 0;
    let score = 0;

    // Masukkan list klu ke dalam UI
    const clueList = document.getElementById('clue-list');
    gameData.forEach(item => {
        let span = document.createElement('span');
        span.className = 'hint-item';
        span.innerText = item.word;
        clueList.appendChild(span);
    });

    document.getElementById('user-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkAnswer();
    });

    function checkAnswer() {
        const inputField = document.getElementById('user-input');
        const resultText = document.getElementById('result');
        const videoElement = document.getElementById('game-video');
        const videoSource = document.getElementById('video-source');
        
        let answer = inputField.value.toLowerCase().trim();

        if (answer === gameData[currentLevel].word) {
            // BETUL!
            score += 10;
            document.getElementById('score').innerText = score;
            resultText.innerText = "POWER LAH! 🎉";
            resultText.style.color = "#2ed573";
            
            // Bunyi & Confetti
            correctSound.play();
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

            setTimeout(() => {
                currentLevel++;
                if (currentLevel < gameData.length) {
                    document.getElementById('level-text').innerText = `LEVEL ${currentLevel + 1}/20`;
                    videoSource.src = gameData[currentLevel].vid;
                    videoElement.load();
                    videoElement.play();
                    inputField.value = "";
                    resultText.innerText = "";
                } else {
                    // MENANG SEMUA!
                    confetti({ particleCount: 500, spread: 160 });
                    document.querySelector('.container').innerHTML = `
                        <h1 style="font-size: 60px;">🏆</h1>
                        <h2>LEGEND! KAU SIAPKAN SEMUA!</h2>
                        <p>Markah Akhir: <b>${score}</b></p>
                        <button onclick="location.reload()">MAIN SEMULA</button>
                    `;
                }
            }, 1500);

        } else {
            // SALAH
            resultText.innerText = "SALAH TU.. CUBA LAGI! ❌";
            resultText.style.color = "#ff4757";
            document.getElementById('game-box').classList.add('shake');
            setTimeout(() => { document.getElementById('game-box').classList.remove('shake'); }, 500);
        }
    }
</script>

</body>
</html>
