<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Teka Kata Kerja AI Ceria</title>
    <style>
        /* Warna latar belakang gradient yang ceria */
        body { 
            font-family: 'Poppins', sans-serif; 
            text-align: center; 
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
        }

        .container { 
            margin-top: 20px; 
            padding: 30px; 
            background: rgba(255, 255, 255, 0.9); 
            display: inline-block; 
            border-radius: 30px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
            max-width: 450px; 
            width: 95%; 
            border: 5px solid #fff;
        }
        
        .header-info { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; }
        
        /* Box level & score yang colorful */
        #level-text { background: #6c5ce7; color: white; padding: 5px 15px; border-radius: 15px; }
        .score-box { background: #fdcb6e; color: #2d3436; padding: 5px 15px; border-radius: 15px; }
        
        h2 { color: #d63031; text-shadow: 1px 1px 0px #fff; }

        video { 
            width: 100%; 
            border-radius: 20px; 
            border: 6px solid #fab1a0; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
            background: #000; 
        }
        
        input { 
            padding: 15px; 
            width: 85%; 
            border: 3px solid #dfe6e9; 
            border-radius: 15px; 
            margin-bottom: 15px; 
            font-size: 18px; 
            outline: none; 
            text-align: center;
            transition: 0.3s;
        }
        input:focus { border-color: #00cec9; box-shadow: 0 0 15px rgba(0,206,201,0.3); }
        
        /* Butang Neon */
        button { 
            padding: 15px; 
            background: #0984e3; 
            color: white; 
            border: none; 
            border-radius: 15px; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: bold; 
            width: 95%; 
            transition: 0.3s;
            box-shadow: 0 5px 0 #0652dd;
        }
        button:hover { background: #74b9ff; transform: translateY(-2px); }
        button:active { transform: translateY(3px); box-shadow: 0 2px 0 #0652dd; }

        #result { margin-top: 20px; font-size: 22px; font-weight: 900; min-height: 30px; }

        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

<div class="container" id="game-box">
    <div class="header-info">
        <div id="level-text">Level: 1</div>
        <div class="score-box">Markah: <span id="score">0</span></div>
    </div>

    <h2>Teka Aksi Ini! 🎬</h2>
    
    <video id="game-video" autoplay loop muted playsinline>
        <!-- Level 1 guna video menebar -->
        <source id="video-source" src="videos/menebar.mp4" type="video/mp4">
    </video>

    <input type="text" id="user-input" placeholder="Tulis jawapan..." autocomplete="off">
    <button onclick="checkAnswer()">JOM TEKA!</button>
    <p id="result"></p>
</div>

<script>
    // Data game yang dah dibetulkan jalan filenya (path)
    const gameData = [
        { word: "menebar", vid: "videos/menebar.mp4" },
        { word: "memasak", vid: "videos/memasak.mp4" },
        { word: "melompat", vid: "videos/melompat.mp4" }
    ];

    let currentLevel = 0;
    let score = 0;

    document.getElementById('user-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') { checkAnswer(); }
    });

    function checkAnswer() {
        const inputField = document.getElementById('user-input');
        const resultText = document.getElementById('result');
        const videoElement = document.getElementById('game-video');
        const videoSource = document.getElementById('video-source');
        const gameBox = document.getElementById('game-box');
        
        let answer = inputField.value.toLowerCase().trim();

        // Check jawapan ikut currentLevel
        if (answer === gameData[currentLevel].word) {
            score += 10;
            document.getElementById('score').innerText = score;
            resultText.innerText = "YAY! BETUL TEPAT! 🎉";
            resultText.style.color = "#00b894";
            
            setTimeout(() => {
                currentLevel++;
                if (currentLevel < gameData.length) {
                    document.getElementById('level-text').innerText = `Level: ${currentLevel + 1}`;
                    videoSource.src = gameData[currentLevel].vid;
                    videoElement.load();
                    videoElement.play();
                    inputField.value = "";
                    resultText.innerText = "";
                } else {
                    document.querySelector('.container').innerHTML = `
                        <h1 style="font-size: 60px;">🥇</h1>
                        <h2 style="color:#6c5ce7">Giler Ah, Terer!</h2>
                        <p style="font-size:20px">Total Markah: <b>${score}</b></p>
                        <button onclick="location.reload()">MAIN LAGI SEKALI</button>
                    `;
                }
            }, 1500);

        } else {
            resultText.innerText = "Alamak, salah! Cuba lagi! 🔥";
            resultText.style.color = "#d63031";
            gameBox.classList.add('shake');
            setTimeout(() => { gameBox.classList.remove('shake'); }, 500);
        }
    }
</script>

</body>
</html>
