
<!-- VERSION: 3.5 | THE LEVEL MAP & LOCK UPDATE | JAGUH KOSA KATA -->
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGUH KOSA KATA AI - v3.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; padding: 20px; overflow-x: hidden;
        }

        .container { 
            background: rgba(255, 255, 255, 0.98); padding: 30px 25px; border-radius: 40px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.3); max-width: 450px; width: 100%; 
            text-align: center; position: relative; border: 8px solid #ffffff;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1.brand { color: #6c5ce7; font-size: 28px; margin: 0 0 15px 0; text-transform: uppercase; letter-spacing: -1px; }

        /* --- DASHBOARD STYLES --- */
        .avatar-circle { font-size: 60px; background: #eeebff; width: 90px; height: 90px; line-height: 90px; border-radius: 50%; margin: 0 auto 10px; border: 4px solid #6c5ce7; }
        .rank-badge { font-size: 12px; color: #6c5ce7; font-weight: bold; background: #eeebff; padding: 5px 15px; border-radius: 15px; margin-bottom: 20px; display: inline-block; border: 1px solid #d1d1ff; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #f1f2f6; padding: 15px; border-radius: 20px; border: 2px solid #fff; }
        .stat-value { display: block; font-size: 24px; font-weight: 600; color: #2d3436; }
        .stat-label { font-size: 11px; color: #636e72; text-transform: uppercase; font-weight: bold; }

        /* --- LEVEL MAP STYLES --- */
        #map-area { max-height: 60vh; overflow-y: auto; padding-right: 10px; margin-bottom: 20px; scrollbar-width: thin; }
        .map-section { margin-bottom: 25px; text-align: left; }
        .map-section-title { font-size: 13px; color: #6c5ce7; font-weight: bold; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 2px solid #eee; display: flex; justify-content: space-between; }
        .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .level-node { 
            aspect-ratio: 1; background: #f1f2f6; border-radius: 12px; display: flex; 
            align-items: center; justify-content: center; font-size: 14px; font-weight: bold; 
            color: #ccc; cursor: not-allowed; border: 2px solid #eee; transition: 0.2s;
        }
        .level-node.unlocked { background: #fff; border-color: #6c5ce7; color: #6c5ce7; cursor: pointer; }
        .level-node.current { background: #6c5ce7; color: #fff; border-color: #6c5ce7; box-shadow: 0 0 15px rgba(108, 92, 231, 0.4); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* --- BUTTONS --- */
        .btn-main { padding: 16px; background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%); color: white; border: none; border-radius: 22px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; box-shadow: 0 8px 0 #4834d4; transition: 0.2s; margin-bottom: 12px; display: block; }
        .btn-main:active { transform: translateY(4px); box-shadow: 0 4px 0 #4834d4; }
        .btn-alt { background: #b2bec3; box-shadow: 0 8px 0 #95a5a6; color: white; }
        .btn-submit { padding: 12px; font-size: 15px; width: 60%; margin: 15px auto 0; box-shadow: 0 5px 0 #4834d4; border-radius: 15px; }

        /* --- GAMEPAGE ELEMENTS --- */
        .header-game { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #game-question { font-size: 14px; font-weight: 600; color: #2d3436; margin: 0 0 10px 0; line-height: 1.3; min-height: 35px; }
        .video-wrapper { width: 100%; border-radius: 25px; overflow: hidden; border: 4px solid #f1f2f6; margin-bottom: 10px; background: #000; }
        video { width: 100%; display: block; }
        .tab-container { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
        .tab-btn { background: #f1f2f6; border: 1px solid #ddd; padding: 6px 12px; border-radius: 10px; cursor: pointer; font-size: 12px; color: #666; }
        .tab-btn.active { background: #6c5ce7; color: white; border-color: #6c5ce7; }
        .tab-content-area { display: none; font-size: 13px; color: #444; background: #eeebff; padding: 12px; border-radius: 15px; margin-bottom: 10px; text-align: left; border-left: 5px solid #6c5ce7; min-height: 50px; line-height: 1.5; }
        input { padding: 14px; width: 100%; border: 3px solid #eee; border-radius: 18px; margin-bottom: 10px; font-size: 16px; text-align: center; outline: none; }
        
        /* ANSWER LIST */
        .hint-section { margin-top: 5px; background: #f8f9fa; padding: 15px; border-radius: 25px; border: 2px dashed #dcdde1; }
        .hint-list { display: flex; flex-wrap: wrap; gap: 8px; max-height: 120px; overflow-y: auto; padding: 5px; justify-content: center; scrollbar-width: thin; }
        .hint-item { background: #fff; padding: 6px 12px; border-radius: 10px; font-size: 11px; color: #7f8c8d; border: 1px solid #eee; }

        /* MODALS */
        #quit-page, #reset-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(45, 52, 54, 0.98); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(10px); }
        .coin-anim { position: fixed; width: 40px; height: 40px; background: #ffd32a; border-radius: 50%; border: 3px solid #f0932b; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; z-index: 9999; pointer-events: none; transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body>

    <!-- 1. STARTUP PAGE -->
    <div id="startup-page" class="container" style="display: none;">
        <h1 class="brand">JAGUH KOSA KATA</h1>
        <p style="color: #636e72; font-size: 14px;">Daftar profil jaguh anda</p>
        <input type="text" id="player-name" placeholder="Nama Hero..." maxlength="12">
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0;">
            <div class="avatar-item" style="cursor:pointer; font-size:30px; background:#f1f2f6; border-radius:15px; padding:10px;" onclick="selectAvatar(this, '🤖')">🤖</div>
            <div class="avatar-item" style="cursor:pointer; font-size:30px; background:#f1f2f6; border-radius:15px; padding:10px;" onclick="selectAvatar(this, '👨‍🚀')">👨‍🚀</div>
            <div class="avatar-item" style="cursor:pointer; font-size:30px; background:#f1f2f6; border-radius:15px; padding:10px;" onclick="selectAvatar(this, '🥷')">🥷</div>
            <div class="avatar-item" style="cursor:pointer; font-size:30px; background:#f1f2f6; border-radius:15px; padding:10px;" onclick="selectAvatar(this, '🦸‍♀️')">🦸‍♀️</div>
        </div>
        <button class="btn-main" onclick="saveAndStart()">JOM MULA 🚀</button>
    </div>

    <!-- 2. DASHBOARD PAGE -->
    <div id="dashboard-page" class="container" style="display: none;">
        <h1 class="brand">PROFIL JAGUH</h1>
        <div class="avatar-circle" id="dash-avatar">🤖</div>
        <div style="font-size: 20px; font-weight: 600;" id="dash-name">Pemain</div>
        <div id="dash-gelaran" class="rank-badge">PELAJAR TEKUN 🎓</div>
        <div class="stats-grid">
            <div class="stat-card"><span class="stat-value" id="dash-level">1</span><span class="stat-label">Level Semasa</span></div>
            <div class="stat-card"><span class="stat-value" id="dash-score">0</span><span class="stat-label">Koin</span></div>
        </div>
        <button class="btn-main" onclick="renderMap()">SAMBUNG MAIN 🔥</button>
        <button class="btn-main btn-alt" onclick="openResetModal()">RESET</button>
    </div>

    <!-- 3. LEVEL MAP PAGE -->
    <div id="map-page" class="container" style="display: none;">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <button onclick="showDashboard()" style="background:none; border:none; color:#6c5ce7; font-weight:bold; cursor:pointer;">← PROFIL</button>
            <h1 class="brand" style="margin:0; font-size:20px;">PETA LEVEL</h1>
            <div style="width:50px;"></div>
        </div>
        <div id="map-area">
            <!-- Grid level akan muncul di sini -->
        </div>
    </div>

    <!-- 4. GAME PAGE -->
    <div id="game-page" class="container" style="display: none;">
        <div class="header-game">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span id="game-avatar" style="font-size: 20px;">🤖</span>
                <span id="game-name" style="font-weight:600; font-size:14px;">Pemain</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <div style="background: #ffd32a; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 13px;" id="score-container">💰 <span id="score">0</span></div>
                <button onclick="showQuitPage()" style="background: #ff4757; color: white; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer;">✕</button>
            </div>
        </div>
        <div style="font-size: 10px; color: #a29bfe; font-weight: bold; text-transform: uppercase; margin-bottom: 5px;" id="level-text">LEVEL 1</div>
        <p id="game-question">Memuatkan...</p>
        <div class="video-wrapper"><video id="game-video" autoplay loop muted playsinline><source id="video-source" src="" type="video/mp4"></video></div>
        <div class="tab-container">
            <button id="btn-tab-q" class="tab-btn" onclick="toggleTab('q')">Contoh Soalan</button>
            <button id="btn-tab-h" class="tab-btn" onclick="toggleTab('h')">Perlu Klu?</button>
        </div>
        <div id="tab-content" class="tab-content-area"></div>
        <input type="text" id="user-input" placeholder="Taip jawapan..." autocomplete="off">
        <div class="hint-section">
            <div class="hint-list" id="clue-list"></div>
        </div>
        <button class="btn-main btn-submit" onclick="checkAnswer()">HANTAR 🚀</button>
        <p id="result" style="min-height:20px; font-weight:bold; margin-top:10px;"></p>
    </div>

    <!-- MODALS -->
    <div id="quit-page"><div class="container"><h1>🥺</h1><h2>Nak berhenti?</h2><button class="btn-main" onclick="continueGame()">SAMBUNG 🔥</button><button class="btn-main btn-alt" onclick="renderMap()">PETA LEVEL</button></div></div>
    <div id="reset-modal"><div class="container"><h1>⚠️</h1><h2>Reset Permainan?</h2><p style="font-size:14px; color:#666;">Semua koin dan level akan dipadamkan!</p><button class="btn-main" onclick="confirmReset()" style="background:#ff4757;">YA, RESET</button><button class="btn-main btn-alt" onclick="closeResetModal()">TIDAK</button></div></div>

    <!-- Audio -->
    <audio id="snd-kaching" src="https://assets.mixkit.co/active_storage/sfx/2017/2017-preview.mp3"></audio>
    <audio id="snd-aww" src="https://assets.mixkit.co/active_storage/sfx/251/251-preview.mp3"></audio>

    <script>
        let score = 0, currentLevel = 0, maxLevelReached = 0, chosenAvatar = "🤖", activeTab = null;

        const ranks = [
            { title: "Pelajar Tekun 🎓", range: [1, 50] },
            { title: "Peneroka Pintar 🧭", range: [51, 100] },
            { title: "Pengembara Gigih 🗺️", range: [101, 150] },
            { title: "Perajurit Perkasa 🛡️", range: [151, 200] },
            { title: "Panglima Gagah ⚔️", range: [201, 250] },
            { title: "Pujangga Kreatif ✒️", range: [251, 300] },
            { title: "Cendekia Bijaksana 🧠", range: [301, 350] },
            { title: "Sarjana Arif 📚", range: [351, 400] },
            { title: "Ilmuwan Terbilang 🏅", range: [401, 450] },
            { title: "Jaguh Ulung 🏆", range: [451, 500] }
        ];

        // 500 LEVEL DATA GENERATOR
        const gameData = [];
        gameData.push({ word: "menebar", vid: "videos/menebar.mp4", q: "Aksi apakah yang dilakukan terhadap doh ini?", example: "Ahmad mahir _______ doh roti canai di warung.", h: "Guna tepung & pusing-pusing." });
        for (let i = 2; i <= 500; i++) {
            gameData.push({ word: `jawapan${i}`, vid: `videos/clip${i}.mp4`, q: `Teka aksi Level ${i}?`, example: `Lorem ipsum _______ level ${i}.`, h: `Klu Lorem Ipsum Level ${i}` });
        }

        window.onload = function() {
            const name = localStorage.getItem('jaguh_name');
            if (name) { 
                maxLevelReached = parseInt(localStorage.getItem('jaguh_max')) || 0;
                showDashboard(); 
            } else { showPage('startup-page'); }
        };

        function showPage(id) {
            ['startup-page', 'dashboard-page', 'map-page', 'game-page', 'quit-page', 'reset-modal'].forEach(p => document.getElementById(p).style.display = 'none');
            const el = document.getElementById(id);
            el.style.display = (id === 'quit-page' || id === 'reset-modal') ? 'flex' : 'block';
        }

        function renderMap() {
            const mapArea = document.getElementById('map-area');
            mapArea.innerHTML = "";
            ranks.forEach(rank => {
                let section = document.createElement('div'); section.className = "map-section";
                section.innerHTML = `<div class="map-section-title"><span>${rank.title}</span><span style="font-size:10px;">LV ${rank.range[0]}-${rank.range[1]}</span></div>`;
                let grid = document.createElement('div'); grid.className = "level-grid";
                for (let l = rank.range[0]; l <= rank.range[1]; l++) {
                    let node = document.createElement('div');
                    node.className = "level-node";
                    node.innerText = l;
                    if (l <= maxLevelReached + 1) {
                        node.classList.add('unlocked');
                        if (l === maxLevelReached + 1) node.classList.add('current');
                        node.onclick = () => startLevel(l - 1);
                    }
                    grid.appendChild(node);
                }
                section.appendChild(grid);
                mapArea.appendChild(section);
            });
            showPage('map-page');
        }

        function startLevel(idx) {
            currentLevel = idx;
            score = parseInt(localStorage.getItem('jaguh_score')) || 0;
            document.getElementById('game-name').innerText = localStorage.getItem('jaguh_name');
            document.getElementById('game-avatar').innerText = localStorage.getItem('jaguh_avatar');
            document.getElementById('score').innerText = score;
            loadLevel(currentLevel);
            initClues();
            showPage('game-page');
        }

        function loadLevel(idx) {
            const data = gameData[idx];
            document.getElementById('level-text').innerText = `LEVEL ${idx + 1}`;
            document.getElementById('game-question').innerText = data.q;
            document.getElementById('video-source').src = data.vid;
            document.getElementById('game-video').load();
            closeTabs();
        }

        function toggleTab(type) {
            const area = document.getElementById('tab-content');
            const data = gameData[currentLevel];
            if (activeTab === type) { closeTabs(); } 
            else {
                area.style.display = 'block'; activeTab = type;
                if (type === 'q') {
                    // Logic: Jika dah pernah settle level ni, tunjuk jawapan terus
                    let sentence = data.example;
                    if (currentLevel < maxLevelReached) {
                        sentence = sentence.replace("_______", `<span style="color:#6c5ce7; text-decoration:underline;">${data.word}</span>`);
                    }
                    area.innerHTML = `<b>Contoh Soalan:</b><br>"${sentence}"`;
                } else { area.innerHTML = `<b>Klu:</b><br>${data.h}`; }
                document.getElementById('btn-tab-q').classList.toggle('active', type === 'q');
                document.getElementById('btn-tab-h').classList.toggle('active', type === 'h');
            }
        }

        function checkAnswer() {
            const input = document.getElementById('user-input');
            const res = document.getElementById('result');
            const ans = input.value.toLowerCase().replace(/[^a-zA-Z0-9 ]/g, "").trim();

            if (ans === gameData[currentLevel].word) {
                document.getElementById('snd-kaching').play();
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                spawnCoin();
                res.innerText = "BETUL! 💰"; res.style.color = "#2ed573";
                
                if (currentLevel === maxLevelReached) {
                    maxLevelReached++;
                    localStorage.setItem('jaguh_max', maxLevelReached);
                }
                score += 10;
                localStorage.setItem('jaguh_score', score);
                
                setTimeout(() => {
                    input.value = ""; res.innerText = "";
                    renderMap(); 
                }, 1500);
            } else {
                document.getElementById('snd-aww').play();
                res.innerText = "SALAH! 🙊"; res.style.color = "#ff4757";
                document.getElementById('game-box').classList.add('shake');
                setTimeout(() => document.getElementById('game-box').classList.remove('shake'), 500);
            }
        }

        function sanitize(text) { return text.replace(/[^a-zA-Z0-9 ]/g, "").trim(); }
        function saveAndStart() {
            const n = sanitize(document.getElementById('player-name').value);
            if(!n) return alert("Sila letak nama!");
            localStorage.setItem('jaguh_name', n);
            localStorage.setItem('jaguh_avatar', chosenAvatar);
            localStorage.setItem('jaguh_max', 0);
            localStorage.setItem('jaguh_score', 0);
            maxLevelReached = 0; startLevel(0);
        }
        function selectAvatar(el, a) { 
            chosenAvatar = a; 
            document.querySelectorAll('.avatar-item').forEach(i => i.style.border = "none"); 
            el.style.border = "3px solid #6c5ce7"; 
        }
        function showDashboard() {
            document.getElementById('dash-name').innerText = localStorage.getItem('jaguh_name');
            document.getElementById('dash-avatar').innerText = localStorage.getItem('jaguh_avatar');
            document.getElementById('dash-level').innerText = maxLevelReached + 1;
            document.getElementById('dash-score').innerText = localStorage.getItem('jaguh_score') || 0;
            document.getElementById('dash-gelaran').innerText = getGelaran(maxLevelReached + 1);
            showPage('dashboard-page');
        }
        function getGelaran(l) { for (let r of ranks) { if (l <= r.range[1]) return r.title; } return "Jaguh Ulung 🏆"; }
        function initClues() { 
            const list = document.getElementById('clue-list');
            list.innerHTML = "";
            const allWords = gameData.map(d => d.word).sort((a,b) => a.localeCompare(b));
            allWords.slice(0, 20).forEach(w => { // Papar 20 perkataan pertama sebagai contoh
                let s = document.createElement('span'); s.className = 'hint-item'; s.innerText = w; list.appendChild(s);
            });
        }
        function closeTabs() { document.getElementById('tab-content').style.display = 'none'; activeTab = null; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); }
        function showQuitPage() { document.getElementById('quit-page').style.display = 'flex'; }
        function continueGame() { document.getElementById('quit-page').style.display = 'none'; }
        function openResetModal() { document.getElementById('reset-modal').style.display = 'flex'; }
        function closeResetModal() { document.getElementById('reset-modal').style.display = 'none'; }
        function confirmReset() { localStorage.clear(); location.reload(); }
        function spawnCoin() {
            const coin = document.createElement('div'); coin.className = 'coin-anim'; coin.innerText = '🪙'; document.body.appendChild(coin);
            const v = document.getElementById('game-video').getBoundingClientRect();
            coin.style.left = (v.left + v.width/2 - 20) + 'px'; coin.style.top = (v.top + v.height/2 - 20) + 'px';
            const d = document.getElementById('score-container').getBoundingClientRect();
            setTimeout(() => { coin.style.left = d.left + 'px'; coin.style.top = d.top + 'px'; coin.style.transform = 'scale(0.2)'; coin.style.opacity = '0'; }, 50);
            setTimeout(() => coin.remove(), 800);
        }
        document.getElementById('user-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAnswer(); });
    </script>
</body>
</html>
